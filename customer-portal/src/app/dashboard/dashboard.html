<div class="dashboard">

  <h2>Welcome, {{ username }} 👋</h2>

  <div class="card-container">

    <div class="card">
      <h3>Profile</h3>
      <p>View your profile details</p>
      <button (click)="getProfile()" class="btn profile-btn">Get Profile</button>
    </div>

    <div class="card">
      <h3>Payments</h3>
      <p>Coming soon</p>
    </div>

    <div class="card">
      <h3>Settings</h3>
      <p>Manage preferences</p>
    </div>

  </div>

  <button class="btn logout-btn" (click)="logout()">Logout</button>

</div>
