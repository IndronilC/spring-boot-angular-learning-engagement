spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/ecomerce_security_db
    username: admin
    password: admin123
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

  mail:
    host: mail-dev
    port: 1025
    username: indronil
    password: indronil
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: false
            trust: "*"
          starttls:
            enable: false
    protocol: smtp

  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

