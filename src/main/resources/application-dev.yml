      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Kolkata   # ✅ Correct time zone
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: localhost
    port: 1025
    username: indronil
    password: indronil
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: false
            trust: "*"
          starttls:
            enable: false
    protocol: smtp
